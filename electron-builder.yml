appId: com.silver.cc-terminal
productName: CC Terminal
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

# 禁掉自动 rebuild：@lydell/node-pty 自带 N-API 预编译二进制，rebuild 反而触发本机现场编译
npmRebuild: false

# electron-updater 更新源：据此生成 app-update.yml（打进应用）与 latest.yml（CI 上传到 Release）；
# CI 构建带 --publish never，实际发布由 workflow 的 release action 完成
publish:
  provider: github
  owner: Sh-Fang
  repo: CC-Terminal

# @lydell/node-pty、koffi 解到 app.asar.unpacked，require 才能加载 .node / OpenConsole.exe / conpty.dll
asarUnpack:
  - '**/node_modules/@lydell/**'
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'

files:
  - out/**/*
  - resources/**/*
  # 只供打包器生成各平台图标，不进应用包
  - '!resources/icon-1024.png'
  - '!resources/icon-mac.png'
  - '!resources/icons/**'
  - package.json
  - '!**/*.map'
  - '!**/test/**'
  - '!**/tests/**'

win:
  icon: resources/icon.ico
  # 不用 ${productName}：带空格的文件名上传 GitHub 会被改名（空格→点），
  # 与 latest.yml 里净化后的 URL（空格→横杠）对不上，electron-updater 下载 404
  artifactName: CC-Terminal-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64

# macOS：不签名；打包器从 icon-mac.png 生成 icns；mac target 只能在 macOS 上构建
# 文件名带 mac：x64 的 zip 与 Windows 便携 zip 同名，合并上传 Release 时会互相覆盖
mac:
  category: public.app-category.developer-tools
  icon: resources/icon-mac.png
  artifactName: CC-Terminal-${version}-mac-${arch}.${ext}
  identity: null            # 不签名/公证，首次打开需右键→打开绕过 Gatekeeper
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  artifactName: CC-Terminal-${version}-mac-${arch}.${ext}

# 图标给多尺寸目录：hicolor 主题最大只登记到 512x512，单给 1024 图会装进不被扫描的目录，菜单里显示成默认齿轮
linux:
  icon: resources/icons
  category: Development
  # 控制文件描述用纯英文：应用中心读 deb 描述时中文会变成问号；中文简介放进 .desktop 的 Comment[zh_CN]
  synopsis: Multi-window terminal for Claude Code and Codex
  description: A multi-window terminal manager built for Claude Code and Codex.
  desktop:
    entry:
      Comment[zh_CN]: 适配 Claude Code 与 Codex 的多窗口管理终端
  # deb 包必填维护者
  maintainer: Sh-Fang <46022639+Sh-Fang@users.noreply.github.com>
  artifactName: CC-Terminal-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
    - target: tar.gz
      arch: x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CC Terminal
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  deleteAppDataOnUninstall: false
  # 注册资源管理器"在此处打开"右键菜单，卸载时清理
  include: scripts/installer.nsh
